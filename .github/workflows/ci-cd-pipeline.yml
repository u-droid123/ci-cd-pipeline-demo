name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # CI JOB: Build and Test
  test:
    name: 🔨 Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📦 Install dependencies
        run: npm install
      
      - name: 🧪 Run automated tests
        run: npm test
      
      - name: 📊 Display test results
        if: always()
        run: |
          echo "✅ Test execution completed"
          echo "📝 Check the test output above for details"
  
  # CD JOB: Deploy to GitHub Pages
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          user_name: 'u-droid123'
          user_email: 'upendra.karki@westcliff.edu'
          commit_message: '🚀 Auto-deployed by GitHub Actions'
      
      - name: 📢 Deployment complete
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Your site: https://u-droid123.github.io/${{ github.event.repository.name }}/"
