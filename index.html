<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Pipeline Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            margin: auto;
        }
        h1 { color: #fff; }
        .status { color: #4caf50; font-weight: bold; }
        .user { color: #ffd700; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 CI/CD Pipeline Success!</h1>
        <p>This application was deployed using <strong>GitHub Actions</strong></p>
        <p>User: <span class="user">u-droid123</span></p>
        <p class="status">✅ DEPLOYMENT STATUS: SUCCESSFUL</p>
        <p id="timestamp"></p>
    </div>
    <script>
        document.getElementById('timestamp').innerHTML = 'Deployed: ' + new Date().toLocaleString();
    </script>
</body>
</html>
